name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    # Same CI_RUNNER switch as tests.yml. Trusted publishing keeps working on a
    # self-hosted runner: the OIDC token is minted by GitHub, not by the runner.
    # The runner does need Docker, because pypa/gh-action-pypi-publish is a
    # container action.
    #
    # This job only ever runs on a v* tag push, which cannot come from a fork,
    # but the same guard is kept so both workflows read identically.
    runs-on: ${{ (vars.CI_RUNNER == 'self-hosted' && github.event.pull_request.head.repo.fork != true) && fromJSON('["self-hosted","vm"]') || 'ubuntu-latest' }}
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Uses trusted publishing - configure at pypi.org
        # No API token needed if trusted publishing is set up
        verbose: true
