name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # Self-hosted when the repo variable CI_RUNNER is set to 'self-hosted'
    # (used while the GitHub-hosted Actions quota is exhausted), GitHub-hosted
    # otherwise. Flip it in Settings > Secrets and variables > Actions >
    # Variables; no workflow edit is needed to switch back.
    #
    # A pull request from a FORK always goes to a GitHub-hosted runner, never
    # to ours. This repository is public, so a self-hosted runner would
    # otherwise execute a stranger's patch on our own machine, with our
    # network and whatever the runner user can reach. Fork PRs are rare, so
    # the quota cost of this exception is negligible.
    runs-on: ${{ (vars.CI_RUNNER == 'self-hosted' && github.event.pull_request.head.repo.fork != true) && fromJSON('["self-hosted","vm"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ \
          --cov=src/satellome \
          --cov-report=xml \
          --cov-report=term \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
